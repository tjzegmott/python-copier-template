[project]
name = "python-copier-template"
version = "0.2.0"
description = "A Copier template for Python projects using Astral's toolchain"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Tarik Zegmott", email = "tzegmott@gmail.com" }]
dependencies = [
    "copier>=9.14.1",
    "idna>=3.15",
    "markdown>=3.10.2",
    "pip>=26.1",
    "pygments>=2.20.0",
    "pymdown-extensions>=10.21.3",
    "pytest>=9.0.3",
    "requests>=2.33.0",
    "urllib3>=2.7.0",
]

[dependency-groups]
dev = [
  "copier>=9.11.3",
  "copier-template-extensions>=0.3.3",
  "pip-audit>=2.10.0",
  "prek>=0.1.0",
  "pysentry-rs>=0.4.0",
  "pytest>=9.0.2",
  "ruff>=0.14.14",
  "ty>=0.0.14",
]
docs = ["mkdocs>=1.6.0", "mkdocs-material>=9.7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ty.src]
include = ["**/*.py"]
